# ---------------------------------------------------------------------------
# 외부 링크 검사 — 주 1회 + 수동 실행
# 외부 사이트가 잠깐 죽거나 봇을 막으면 실패하므로 push/PR 검사(ci.yml)와 분리했다.
# 실패하면: 원문이 사라졌는지 확인하고, 사라졌으면 archive.org 사본으로 바꾼다 (docs/05 참고).
# ---------------------------------------------------------------------------
name: 외부 링크

on:
  schedule:
    - cron: "0 0 * * 1"     # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # localhost 는 로컬 스택 주소라 CI 에서 열 수 없다.
          # 403/429 는 봇 차단·요청 제한(O'Reilly 등)이라 "링크가 죽었다" 는 뜻이 아니다.
          args: >-
            --no-progress
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude-path docs/architecture-presentation.html
            --accept '200..=299,403,429'
            --max-retries 3
            './**/*.md'
          fail: true
